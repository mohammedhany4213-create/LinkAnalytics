name: .NET CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore LinkAnalytics.sln

      - name: Build
        run: dotnet build LinkAnalytics.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test LinkAnalytics.sln --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Build Docker image
        run: docker build --tag linkanalytics-api:ci .
